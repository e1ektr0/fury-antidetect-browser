name: Build Linux Core (Chromium)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name to attach core to (e.g. v0.1.3)'
        required: false
        default: 'v0.1.3'

permissions:
  contents: write

jobs:
  build-core:
    name: Build Chromium Core (Linux x64)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space on runner
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Install system build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git python3 curl xz-utils build-essential lsb-release \
            pkg-config bison gperf \
            libglib2.0-dev libgtk-3-dev libnss3-dev libpci-dev \
            libasound2-dev libpulse-dev libxss-dev libxtst-dev \
            libxcomposite-dev libxcursor-dev libxdamage-dev libxi-dev \
            libxrandr-dev libdrm-dev libgbm-dev libcups2-dev libkrb5-dev libva-dev

      - name: Fetch Chromium source
        run: |
          export FORCE=1
          CHROMIUM_VER=$(cat core/CHROMIUM_VERSION)
          echo "Fetching Chromium $CHROMIUM_VER..."
          ./core/build/fetch.sh "$CHROMIUM_VER"

      - name: Apply Fury C++ anti-detect patches
        run: |
          ./core/build/apply.sh

      - name: Build Chromium core
        run: |
          ./core/build/build.sh linux-x64

      - name: Package Linux core tarball
        run: |
          ./tools/release/pack-core-linux.sh

      - name: Upload core to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag_name || 'v0.1.3' }}
        run: |
          CORE_ARCHIVE=$(find dist -name "fury-core-*-linux-x64.tar.xz" | head -n 1)
          if [ -z "$CORE_ARCHIVE" ] || [ ! -f "$CORE_ARCHIVE" ]; then
            echo "Error: Core archive not found!" >&2
            exit 1
          fi
          echo "Uploading $CORE_ARCHIVE to release $TAG..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$CORE_ARCHIVE" --clobber
          else
            gh release create "$TAG" "$CORE_ARCHIVE" \
              --title "Fury $TAG" \
              --notes "Automated build of Fury anti-detect browser." \
              --prerelease
          fi
          echo "Core archive successfully uploaded to release $TAG!"
