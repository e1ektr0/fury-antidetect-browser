name: Build Linux .deb Package

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.1.3)'
        required: false
        default: 'v0.1.3'
      draft:
        description: 'Create draft release'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb package (Debian / Linux Mint)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install npm dependencies
        run: |
          cd desktop
          npm ci

      - name: Build Fury desktop and deb package
        run: |
          cd desktop
          npx tauri build --bundles deb

      - name: Locate generated .deb package
        id: find_deb
        run: |
          DEB_PATH=$(find target desktop/src-tauri/target -name "*.deb" 2>/dev/null | head -n 1)
          if [ -z "$DEB_PATH" ] || [ ! -f "$DEB_PATH" ]; then
            echo "Error: No .deb package found after build!" >&2
            exit 1
          fi
          echo "Found .deb package at: $DEB_PATH"
          echo "deb_path=$DEB_PATH" >> "$GITHUB_OUTPUT"
          echo "deb_name=$(basename "$DEB_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload .deb package as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find_deb.outputs.deb_name }}
          path: ${{ steps.find_deb.outputs.deb_path }}
          if-no-files-found: error

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag_name || 'v0.1.3' }}
          DEB_PATH: ${{ steps.find_deb.outputs.deb_path }}
          IS_DRAFT: ${{ inputs.draft }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          echo "Publishing $DEB_PATH to release $TAG..."
          DRAFT_FLAG=""
          if [ "$IS_DRAFT" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi

          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading asset..."
            gh release upload "$TAG" "$DEB_PATH" --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" "$DEB_PATH" \
              --title "Fury $TAG (Linux .deb)" \
              --notes "Linux .deb package of Fury anti-detect browser for Debian 12 / Linux Mint MATE / Ubuntu." \
              $DRAFT_FLAG $PRERELEASE_FLAG
          fi
          echo "Release updated successfully!"
